name: Live snapshot for Friday check

on:
  schedule:
    # Fridays. GitHub often starts scheduled runs ~1 hour late, so slots start early and repeat every 10 min.
    # Each run fetches prices at the moment it actually runs; the latest snapshot is kept.
    - cron: '0,10,20,30,40,50 7 * * 5'  # Fri 12:30-13:20 IST
    - cron: '0,10,20,30,40,50 8 * * 5'  # Fri 13:30-14:20 IST
    - cron: '0,10,20,30 9 * * 5'        # Fri 14:30-15:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-snapshot
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Live snapshot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$(TZ=Asia/Kolkata date +%u)" != "5" ] || [ "$(TZ=Asia/Kolkata date +%H%M)" -gt 1535 ]; }; then
            echo "outside Friday market hours"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          python live_fetch.py
      - name: Commit snapshot
        if: env.SKIP != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A live
          if git diff --staged --quiet; then echo "nothing new"; else git commit -m "Live snapshot $(date -u +%FT%H:%M)"; for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done; fi
